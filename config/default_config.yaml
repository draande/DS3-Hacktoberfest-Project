# Wingman default thresholds. Distances are normalized landmark units.
# Angles are degrees. The volume scale is documented in src/audio/volume_analyzer.py.

timer:
  # Five-minute presentation. Override with --timer to preview the vignette.
  duration_seconds: 300
  warning_ratio: 0.25
  critical_ratio: 0.10

posture:
  # Absolute line used by the demo. Live mode calibrates a baseline from
  # the first few seconds and cues on deviation past the margins below,
  # because a laptop webcam looks up and a fixed 12° line never goes quiet.
  slouch_degrees: 12.0
  ear_forward_offset: 0.15
  calibrate_seconds: 3.0
  slouch_margin_degrees: 8.0
  forward_margin: 0.08

gaze:
  # Prolonged fixation away from the audience.
  away_seconds: 4.0
  # Horizontal iris ratio is 0.5 at center. Past this offset counts as away.
  off_center: 0.18
  # Vertical iris ratio grows as the speaker looks down at notes.
  look_down: 0.65
  # Share of recent samples stuck on one side of the room.
  side_bias_ratio: 0.75
  history_seconds: 6.0

audience:
  # Inner-brow distance divided by interocular distance. Below this, the brow is furrowed.
  brow_gap_ratio: 0.22
  # Eye aspect ratio above this counts as widened eyes.
  eye_aspect_wide: 0.42
  # Brow-to-eyelid distance divided by interocular distance.
  brow_raise_ratio: 0.18

volume:
  # Comfortable-room threshold from the audio spec. The sequence diagram's
  # 40 dB case is the same comparison with a lower cutoff.
  speak_up_db: 42.0
  quiet_duration_seconds: 3.0
  # Digital PCM has no SPL. This reference maps a full-scale sine near 80 dB
  # and a quiet talker under 42 dB. See volume_analyzer.rms_to_db.
  reference_amplitude: 1.0e-4
  # Short window so a drop is visible within 500 ms. The 3 s timer above
  # still decides when the cue is allowed to fire.
  level_window_seconds: 0.5

pace:
  target_wpm_min: 130
  target_wpm_max: 160
  rush_wpm: 180
  continuous_speech_seconds: 8.0
  syllables_per_word: 1.5
  pause_seconds: 0.35
  vad_rms: 0.02
  window_seconds: 2.5

cues:
  cooldown_seconds: 5.0
  snooze_seconds: 30.0
  duration_ms: 3000
  # Extra gap so two different cues cannot stack in the same second.
  global_gap_seconds: 1.0

hud:
  theme: ironman
  opacity: 0.85
  width: 1280
  height: 720
  fps: 30
  # Gemma's short bullets. Newest line is on top and fades out over fade_seconds.
  sidebar:
    side: right
    width_ratio: 0.22
    max_bullets: 4
    ttl_seconds: 12
    fade_seconds: 3
  # Reserved for the avatar. See draw_avatar in src/hud/avatar.py.
  avatar:
    anchor: sidebar_top
    height_ratio: 0.24

audio:
  sample_rate: 16000
  channels: 1
  # 256 samples at 16 kHz is 16 ms, under the 20 ms capture budget.
  block_size: 256
  buffer_seconds: 2.5

insight:
  # Periodic sidebar trends. Real-time cues do not wait on this.
  # Override with INSIGHT_MODEL. This model can be polled tighter than
  # the slow Gemma client; one call stays in flight, and 429/504 still back off.
  model: gemini-3.5-flash-lite
  min_interval_seconds: 8
  # Google rejects deadlines under 10 seconds.
  timeout_seconds: 10
  max_output_tokens: 256
  # Gemini 3.5 uses thinking_level. minimal is set explicitly.
  thinking_level: minimal

gemma:
  # Slow path only: the end-of-session report, and Ask Gemma when that
  # feature calls GemmaClient.generate. Do not point the insight loop here.
  # gemma-4 hides thinking tokens, so the output cap stays large and this
  # client does not send a thinking config or JSON response mode.
  # Override the model with GEMMA_MODEL.
  model: gemma-4-26b-a4b-it
  min_interval_seconds: 18
  timeout_seconds: 45
  report_timeout_seconds: 90
  max_output_tokens: 2048

ask:
  media_key:
    # Global earbud button for Ask Gemma push-to-talk. Also --earbud.
    # backend: auto tries the Windows media session (SMTC) first, then the
    # keyboard hook. smtc needs `uv sync --group earbud` on Windows.
    # keys: play_pause (default), next, previous, stop, headset, or a VK code.
    # suppress swallows those keys on the hook only. SMTC owns the session,
    # so other players may pause while Wingman is running.
    enabled: false
    backend: auto
    keys:
      - play_pause
    suppress: true

summary:
  # Running summary of the talk on the Flash Lite insight model.
  # Each update sends the previous summary plus the new stretch only.
  # It does not call Gemma. Speech text needs `uv sync --group stt`.
  enabled: true
  interval_seconds: 20
  max_output_tokens: 512

voice:
  # After the session, Grok speaks the summary and a short strengths list.
  # Set XAI_API_KEY. Do not put the key in this file.
  # Endpoint: POST https://api.x.ai/v1/tts
  # Model: grok-tts. Built-in voices: eve, ara, leo, rex, sal.
  # playback false still saves the wav next to the report.
  enabled: true
  voice_id: eve
  language: en
  playback: true
